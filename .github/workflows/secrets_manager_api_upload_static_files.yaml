---
name: Secrets Manager API - Upload Static Files to S3
on:
  push:
    branches:
      - master
    paths:
      - 'secrets-manager-api/static/**'

jobs:
  upload-files:
    runs-on: ubuntu-24.04
    env:
      BUCKET_NAME: "secrets-manager-api-static-content-bucket"
      CLOUDFRONT_DISTRIBUTION_ID: "E3TIUAC1ROFGZO"
      CLOUDFRONT_DISTRIBUTION_DOMAIN_NAME: "d3oqutk1omwau3.cloudfront.net"
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Upload static files to S3
      run: |
        aws s3 sync secrets-manager-api/static/ "s3://${BUCKET_NAME}/static/" --delete
        aws cloudfront create-invalidation --distribution-id ${CLOUDFRONT_DISTRIBUTION_ID} --paths "/static/*"
        echo "https://${CLOUDFRONT_DISTRIBUTION_DOMAIN_NAME}"
